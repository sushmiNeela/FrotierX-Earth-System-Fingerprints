<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth System Fingerprints</title>
<style>
:root{color-scheme:dark;--bg:#02030a;--fg:#e6edf7;--mut:#8b9ab3;--pan:rgba(8,13,26,.86);--ln:rgba(140,170,220,.22);--ac:#60a5fa}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:18px;pointer-events:none}
#brand h1{margin:0;font-size:19px;letter-spacing:.02em}#brand h1 b{color:var(--ac)}
#brand p{margin:3px 0 0;font-size:11.5px;color:var(--mut);max-width:260px;line-height:1.4}
#nav{position:absolute;top:calc(92px + env(safe-area-inset-top,0px));left:18px;display:flex;flex-direction:column;gap:8px}
button,label.btn{font:inherit;font-size:12.5px;background:rgba(12,18,34,.75);color:var(--fg);border:1px solid var(--c,var(--ln));padding:7px 13px;border-radius:99px;cursor:pointer;text-align:left;backdrop-filter:blur(8px)}
button:hover,button.on{background:var(--c,var(--ac));color:#04101c}
#tools{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:18px;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--mut)}
label.btn input{display:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:14px;color:var(--mut);z-index:5}
.lab{position:absolute;pointer-events:none;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.6);border:1px solid;transform:translate(-50%,-135%);white-space:nowrap}
#panel{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;bottom:14px;width:370px;max-width:calc(100% - 28px);overflow:auto;padding:16px;background:var(--pan);border:1px solid var(--ln);border-radius:16px;backdrop-filter:blur(14px);display:none;font-size:13px}
#panel h2{margin:8px 0 2px;font-size:20px}.sub{color:var(--mut);font-size:12px;line-height:1.5;margin:0 0 10px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.tabs button{padding:5px 10px;font-size:12px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.kpi div{border:1px solid var(--ln);border-radius:10px;padding:8px 10px}.kpi small{display:block;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-size:16px}
.badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.4)}
svg.ch{width:100%;height:auto;margin-top:6px}svg text{fill:var(--mut);font-size:9px}
.note{font-size:12px;line-height:1.55;color:#c8d3e6;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:11px}
tr.rw{cursor:pointer}tr.rw:hover{background:rgba(255,255,255,.05)}
ul{padding-left:18px;margin:6px 0}li{margin:5px 0;line-height:1.5;font-size:12px;color:#c8d3e6}
#close{padding:4px 10px;font-size:12px}
@media(max-width:700px){#panel{top:auto;left:10px;right:10px;width:auto;max-width:none;bottom:10px;height:56%}
 #nav{top:calc(84px + env(safe-area-inset-top,0px));flex-direction:row;flex-wrap:wrap;right:10px}#tools{display:none}}

function pick(i){sel=REG[i];ret=false;panel.style.display='block';REG.forEach((r,k)=>r.btn.classList.toggle('on',k===i));render()}
function closeP(){sel=null;ret=true;panel.style.display='none';REG.forEach(r=>r.btn.classList.remove('on'))}
function chart(dd,col,l){const{x,y,st}=dd,W=320,H=170,m={l:38,r:10,t:10,b:24},ya=y.concat([st.a+st.b*x[0],st.a+st.b*x[x.length-1]]);
 let lo=Math.min(...ya),hi=Math.max(...ya),pad=(hi-lo)*.12||.01;lo-=pad;hi+=pad;
 const X=v=>m.l+(v-x[0])/(x[x.length-1]-x[0])*(W-m.l-m.r),Y=v=>H-m.b-(v-lo)/(hi-lo)*(H-m.t-m.b);let s='<svg class="ch" viewBox="0 0 '+W+' '+H+'">';
 for(let t=0;t<=4;t++){const v=lo+(hi-lo)*t/4;s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="rgba(140,170,220,.15)"/><text x="'+(m.l-5)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v.toFixed(l.d>2?3:1)+'</text>'}
 const step=x.length>12?4:2;x.forEach((v,i)=>{if((v-x[0])%step===0)s+='<text x="'+X(v)+'" y="'+(H-8)+'" text-anchor="middle">'+v+'</text>'});
 s+='<polyline fill="none" stroke="'+col+'" stroke-opacity=".45" stroke-width="1.2" points="'+x.map((v,i)=>X(v)+','+Y(y[i])).join(' ')+'"/>';
 x.forEach((v,i)=>s+='<circle cx="'+X(v)+'" cy="'+Y(y[i])+'" r="2.8" fill="'+col+'"/>');
 s+='<line x1="'+X(x[0])+'" y1="'+Y(st.a+st.b*x[0])+'" x2="'+X(x[x.length-1])+'" y2="'+Y(st.a+st.b*x[x.length-1])+'" stroke="#fff" stroke-width="1.8" stroke-dasharray="5 3"/></svg>';return s}
function render(){const r=sel,L=LAY[lay];
 let h='<button id="close">← Back to space</button><h2 style="color:'+r.c+'">'+r.n+'</h2><p class="sub">'+r.b+'<br>Centre '+r.lat.toFixed(1)+'°, '+r.lon.toFixed(1)+'°</p><div class="tabs">';

 if(tab==='lay'){const dd=DATA[r.id+L.id],s=dd.st,dir=s.b>0?'increase':'decrease',sg=s.p<.05;
  h+='<b>'+L.t+'</b><div class="sub">'+L.prod+'<br>'+L.what+'<br>Period '+L.y0+'–'+L.y1+' (n = '+s.n+' years)</div><span class="badge">Illustrative demo series — not real NASA output</span>'+chart(dd,r.c,L)+
  '<div class="sub" style="margin-top:2px">● annual mean &nbsp; ╌ Sen\'s slope trend line</div><div class="kpi">'+
  '<div><small>Sen\'s slope / yr</small><b>'+fmt(s.b,L.d+1)+' '+L.u+'</b></div><div><small>Per decade</small><b>'+fmt(s.b*10,L.d)+' '+L.u+'</b></div>'+
  '<div><small>Mann–Kendall Z</small><b>'+s.Z.toFixed(2)+'</b></div><div><small>p-value</small><b>'+(s.p<.001?'<0.001':s.p.toFixed(3))+'</b></div>'+
  '<div><small>Kendall τ</small><b>'+s.tau.toFixed(2)+'</b></div><div><small>S statistic</small><b>'+s.S+'</b></div></div>'+
  '<p class="note">'+L.s+' shows a <b>'+(sg?dir:'no clear direction')+'</b>: '+fmt(s.b*10,L.d)+' '+L.u+' per decade, '+verdict(s.p)+'. '+
  (L.id==='lst'?'Rising surface temperature raises evapotranspiration demand and heat stress.':L.id==='ndvi'?'Falling NDVI can indicate land-cover change or vegetation stress; rising NDVI can reflect irrigation and intensified cropping.':'Declining soil moisture can signal drying, groundwater-driven irrigation shifts or rainfall variability.')+'</p>'}
 else if(tab==='cmp'){h+='<b>Region comparison — trend per decade</b><div class="sub">Sen\'s slope (Mann–Kendall: * p&lt;0.05, ** p&lt;0.01)</div><table><tr><th>Region</th>'+LAY.map(l=>'<th>'+l.s+'</th>').join('')+'</tr>';
  REG.forEach((q,qi)=>{h+='<tr class="rw" data-r="'+qi+'"><td style="color:'+q.c+'">'+q.n+'</td>'+LAY.map(l=>{const s=DATA[q.id+l.id].st;return'<td>'+(s.b>0?'▲':'▼')+' '+fmt(s.b*10,l.d).slice(1)+(s.p<.01?'**':s.p<.05?'*':'')+'</td>'}).join('')+'</tr>'});
  h+='</table><p class="note">Units per decade: LST °C, NDVI unitless, soil moisture m³/m³. Soil-moisture trends cover 2016–2024 only, so they are less robust than the 24-year LST and NDVI trends.</p><span class="badge">Illustrative demo series</span>'}
 else{h+='<b>Evidence &amp; method</b><ul><li><b>MOD11A1 v6.1</b> — Terra MODIS daily land surface temperature &amp; emissivity, 1 km. Annual daytime mean per region.</li><li><b>MOD13Q1 v6.1</b> — Terra MODIS 16-day NDVI/EVI, 250 m. Quality-filtered, annual mean.</li><li><b>SPL3SMP_E</b> — SMAP Enhanced L3 radiometer soil moisture, 9 km, from 31 Mar 2015.</li><li><b>Sen\'s slope</b> (Theil–Sen) is the median of all pairwise slopes. It is robust to outliers and needs no normality assumption.</li><li><b>Mann–Kendall</b> tests monotonic trend using S, Z and a two-sided p-value (normal approximation, no tie or autocorrelation correction).</li><li><b>Caveats</b>: short SMAP record, cloud contamination in monsoon and Amazon seasons, and spatial averaging of mixed land cover.</li><li><b>Visuals</b>: Earth surface is a stylised render with correct geography. Use the Blue Marble button for NASA composite imagery; it is a composite, not a live view.</li><li><b>To use real data</b>: replace the series in <code>DATA[region+layer]</code> with processed annual means. All statistics recompute automatically.</li></ul>'}
 panel.innerHTML=h;

const tgt=new THREE.Vector3(),clk=new THREE.Clock(),wrap=a=>((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI,wv=new THREE.Vector3();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=performance.now()/1000;

  wv.copy(ll(r.lat,r.lon,1.02)).applyMatrix4(EG.matrixWorld);const vis=wv.dot(cam.position.clone().sub(wv))>0.02;wv.project(cam);
